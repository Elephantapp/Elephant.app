<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - Connect With Randoms</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px;
            background: #1f2937;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.35);
        }

        img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #6366f1;
        }

        h1 {
            margin-bottom: 10px;
        }

        .email {
            color: #9ca3af;
        }

        button {
            margin-top: 25px;
            padding: 15px 35px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .logout {
            display: block;
            margin-top: 20px;
            color: #9ca3af;
            text-decoration: none;
        }

        .logout:hover {
            color: white;
        }

    </style>

</head>

<body>

    <div class="container">

        {% if user.picture %}

            <img
                src="{{ user.picture }}"
                alt="Profile"
            >

        {% endif %}

        <h1>
            Welcome, {{ user.name }} 👋
        </h1>

        <p class="email">
            {{ user.email }}
        </p>

        <button
            onclick="window.location.href='/connect'"
        >
            🎥 Start Connecting
        </button>

        <a
            class="logout"
            href="/logout"
        >
            Logout
        </a>

    </div>

</body>

</html>
