<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Connect With Randoms</title>

    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080b12;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin: 10px 0 25px;
        }

        .permission-box {
            background: #111622;
            border: 1px solid #303747;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .permission-box h2 {
            margin-top: 0;
        }

        .permission-box p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .videos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .video-box {
            position: relative;
            background: #111622;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #303747;
            min-height: 280px;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 280px;
            object-fit: cover;
            background: #000;
        }

        .label {
            position: absolute;
            z-index: 5;
            top: 12px;
            left: 12px;
            padding: 7px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            font-size: 13px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 13px 18px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            background: #374151;
        }

        button:hover {
            opacity: 0.9;
        }

        #permissionBtn {
            background: #6366f1;
        }

        #findBtn {
            background: #2563eb;
        }

        #nextBtn {
            background: #059669;
        }

        #endBtn {
            background: #dc2626;
        }

        #status {
            text-align: center;
            margin-top: 18px;
            min-height: 24px;
            color: #9ca3af;
        }

        #permissionStatus {
            margin-top: 12px;
            color: #9ca3af;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 700px) {

            .videos {
                grid-template-columns: 1fr;
            }

            .video-box,
            video {
                min-height: 230px;
            }

            .controls {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <h1>Connect With Randoms</h1>

    <!-- CAMERA / MICROPHONE PERMISSION -->

    <div
        class="permission-box"
        id="permissionBox"
    >

        <h2>🎥🎤 Camera & Microphone</h2>

        <p>

            Connect With Randoms use karne ke liye
            Camera aur Microphone permission required hai.

            <br><br>

            <b>Allow Camera & Microphone</b>

            button dabao aur browser mein
            <b>Allow</b> select karo.

        </p>

        <button id="permissionBtn">
            Allow Camera & Microphone
        </button>

        <div id="permissionStatus"></div>

    </div>


    <!-- VIDEOS -->

    <div class="videos">

        <div class="video-box">

            <div class="label">
                📹 Your Video
            </div>

            <video
                id="localVideo"
                autoplay
                muted
                playsinline
            ></video>

        </div>


        <div class="video-box">

            <div class="label">
                👤 Random Video
            </div>

            <video
                id="remoteVideo"
                autoplay
                playsinline
            ></video>

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button id="micBtn">
            🎤 Mic On
        </button>

        <button id="cameraBtn">
            📹 Camera On
        </button>

        <button id="findBtn">
            🔀 Find Random
        </button>

        <button id="nextBtn">
            ➡️ Next
        </button>

        <button id="endBtn">
            ❌ End
        </button>

    </div>


    <div id="status">
        Allow camera and microphone to begin.
    </div>


    <a
        class="back"
        href="/profile"
    >
        ← Back to Profile
    </a>

</div>


<script>

    // ====================================================
    // SOCKET.IO
    // ====================================================

    const socket = io("https://elephant-app.onrender.com", {

        transports: ["websocket", "polling"],

        upgrade: true,

        reconnection: true,

        reconnectionAttempts: 10,

        reconnectionDelay: 1000

    });


    // ====================================================
    // DOM
    // ====================================================

    const localVideo =
        document.getElementById("localVideo");

    const remoteVideo =
        document.getElementById("remoteVideo");

    const permissionBtn =
        document.getElementById("permissionBtn");

    const permissionStatus =
        document.getElementById("permissionStatus");

    const permissionBox =
        document.getElementById("permissionBox");

    const micBtn =
        document.getElementById("micBtn");

    const cameraBtn =
        document.getElementById("cameraBtn");

    const findBtn =
        document.getElementById("findBtn");

    const nextBtn =
        document.getElementById("nextBtn");

    const endBtn =
        document.getElementById("endBtn");

    const statusText =
        document.getElementById("status");


    // ====================================================
    // STATE
    // ====================================================

    let localStream = null;

    let peerConnection = null;

    let partnerSid = null;

    let isInitiator = false;

    let isSearching = false;


    // ====================================================
    // WEBRTC
    // ====================================================

    const rtcConfig = {

        iceServers: [

            {
                urls: "stun:stun.l.google.com:19302"
            },

            {
                urls: "stun:stun1.l.google.com:19302"
            }

        ]

    };


    // ====================================================
    // STATUS
    // ====================================================

    function setStatus(message) {

        statusText.textContent = message;

    }


    // ====================================================
    // CAMERA + MICROPHONE
    // ====================================================

    async function requestMedia() {

        try {

            console.log("Requesting camera/microphone...");


            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ) {

                throw new Error(
                    "getUserMedia is not available"
                );

            }


            localStream =
                await navigator.mediaDevices.getUserMedia({

                    video: {
                        width: {
                            ideal: 1280
                        },
                        height: {
                            ideal: 720
                        },
                        facingMode: "user"
                    },

                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }

                });


            console.log(
                "Camera/Mic permission granted"
            );


            localVideo.srcObject =
                localStream;


            await localVideo.play();


            permissionStatus.textContent =
                "✅ Camera & Microphone enabled.";

            permissionStatus.style.color =
                "#34d399";


            permissionBox.style.display =
                "none";


            setStatus(
                "Ready. Click Find Random."
            );


            return true;

        }

        catch (error) {

            console.error(
                "MEDIA ERROR:",
                error
            );


            permissionStatus.style.color =
                "#f87171";


            if (
                error.name === "NotAllowedError"
            ) {

                permissionStatus.textContent =
                    "❌ Permission denied. Browser address bar se Camera & Microphone Allow karo.";

            }

            else if (
                error.name === "NotFoundError"
            ) {

                permissionStatus.textContent =
                    "❌ Camera ya microphone device nahi mila.";

            }

            else if (
                error.name === "NotReadableError"
            ) {

                permissionStatus.textContent =
                    "❌ Camera/Microphone kisi doosre app mein use ho raha hai.";

            }

            else {

                permissionStatus.textContent =
                    "❌ Camera/Microphone start nahi hua: " +
                    error.message;

            }


            setStatus(
                "Camera/Microphone enable nahi hua."
            );


            return false;

        }

    }


    permissionBtn.addEventListener(
        "click",
        requestMedia
    );


    // ====================================================
    // SOCKET CONNECT
    // ====================================================

    socket.on(
        "connect",
        () => {

            console.log(
                "Socket connected:",
                socket.id
            );


            console.log(
                "Transport:",
                socket.io.engine.transport.name
            );


            setStatus(
                "🟢 Server connected. Allow camera & microphone."
            );

        }
    );


    // ====================================================
    // SOCKET ERROR
    // ====================================================

    socket.on(
        "connect_error",
        error => {

            console.error(
                "SOCKET ERROR:",
                error
            );


            setStatus(
                "⚠️ Server connection problem."
            );

        }
    );


    socket.on(
        "disconnect",
        reason => {

            console.warn(
                "Socket disconnected:",
                reason
            );


            setStatus(
                "⚠️ Server connection lost. Reconnecting..."
            );

        }
    );


    // ====================================================
    // CREATE PEER CONNECTION
    // ====================================================

    function createPeerConnection() {

        if (peerConnection) {

            peerConnection.close();

        }


        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        if (localStream) {

            localStream
                .getTracks()
                .forEach(track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                });

        }


        peerConnection.ontrack =
            event => {

                if (
                    event.streams &&
                    event.streams[0]
                ) {

                    remoteVideo.srcObject =
                        event.streams[0];

                    remoteVideo.play()
                        .catch(() => {});

                }

            };


        peerConnection.onicecandidate =
            event => {

                if (
                    event.candidate &&
                    partnerSid
                ) {

                    socket.emit(
                        "ice_candidate",
                        {

                            target:
                                partnerSid,

                            candidate:
                                event.candidate

                        }
                    );

                }

            };


        peerConnection.onconnectionstatechange =
            () => {

                if (!peerConnection) {
                    return;
                }


                console.log(
                    "WebRTC:",
                    peerConnection.connectionState
                );


                if (
                    peerConnection.connectionState ===
                    "connected"
                ) {

                    setStatus(
                        "🟢 Connected!"
                    );

                }


                if (
                    peerConnection.connectionState ===
                    "failed"
                ) {

                    setStatus(
                        "❌ Video connection failed."
                    );

                }

            };


        return peerConnection;

    }


    // ====================================================
    // CREATE OFFER
    // ====================================================

    async function createOffer() {

        if (!peerConnection) {

            createPeerConnection();

        }


        const offer =
            await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            offer
        );


        socket.emit(
            "offer",
            {

                target:
                    partnerSid,

                offer:
                    offer

            }
        );

    }


    // ====================================================
    // AUTH REQUIRED
    // ====================================================

    socket.on(
        "auth_required",
        () => {

            setStatus(
                "Please login first."
            );


            setTimeout(
                () => {

                    window.location.href =
                        "/";

                },
                1200
            );

        }
    );


    // ====================================================
    // FIND RANDOM
    // ====================================================

    findBtn.addEventListener(
        "click",
        async () => {

            if (!localStream) {

                const allowed =
                    await requestMedia();


                if (!allowed) {

                    return;

                }

            }


            if (!socket.connected) {

                setStatus(
                    "⚠️ Server se connection nahi hai."
                );

                return;

            }


            if (isSearching) {

                return;

            }


            isSearching = true;


            setStatus(
                "🔎 Finding a random person..."
            );


            socket.emit(
                "find_random"
            );

        }
    );


    // ====================================================
    // WAITING
    // ====================================================

    socket.on(
        "waiting",
        () => {

            isSearching = true;


            setStatus(
                "⏳ Waiting for a random person..."
            );

        }
    );


    // ====================================================
    // MATCHED
    // ====================================================

    socket.on(
        "matched",
        async data => {

            partnerSid =
                data.partner_sid;


            isInitiator =
                data.initiator;


            isSearching =
                false;


            createPeerConnection();


            setStatus(
                "🎉 Random person found!"
            );


            if (isInitiator) {

                try {

                    await createOffer();

                }

                catch (error) {

                    console.error(
                        "OFFER ERROR:",
                        error
                    );

                }

            }

        }
    );


    // ====================================================
    // OFFER
    // ====================================================

    socket.on(
        "offer",
        async data => {

            try {

                partnerSid =
                    data.from;


                if (!peerConnection) {

                    createPeerConnection();

                }


                await peerConnection.setRemoteDescription(
                    new RTCSessionDescription(
                        data.offer
                    )
                );


                const answer =
                    await peerConnection.createAnswer();


                await peerConnection.setLocalDescription(
                    answer
                );


                socket.emit(
                    "answer",
                    {

                        target:
                            partnerSid,

                        answer:
                            answer

                    }
                );


                setStatus(
                    "📹 Connecting video..."
                );

            }

            catch (error) {

                console.error(
                    "ANSWER ERROR:",
                    error
                );

            }

        }
    );


    // ====================================================
    // ANSWER
    // ====================================================

    socket.on(
        "answer",
        async data => {

            try {

                if (!peerConnection) {
                    return;
                }


                await peerConnection.setRemoteDescription(
                    new RTCSessionDescription(
                        data.answer
                    )
                );


                setStatus(
                    "📹 Connecting video..."
                );

            }

            catch (error) {

                console.error(
                    "ANSWER RECEIVE ERROR:",
                    error
                );

            }

        }
    );


    // ====================================================
    // ICE
    // ====================================================

    socket.on(
        "ice_candidate",
        async data => {

            try {

                if (!peerConnection) {
                    return;
                }


                await peerConnection.addIceCandidate(
                    new RTCIceCandidate(
                        data.candidate
                    )
                );

            }

            catch (error) {

                console.error(
                    "ICE ERROR:",
                    error
                );

            }

        }
    );


    // ====================================================
    // CLOSE CALL
    // ====================================================

    function closeCurrentCall() {

        if (peerConnection) {

            try {

                peerConnection.close();

            }

            catch (error) {

                console.error(error);

            }

            peerConnection = null;

        }


        remoteVideo.srcObject =
            null;


        partnerSid =
            null;


        isInitiator =
            false;

    }


    // ====================================================
    // END
    // ====================================================

    endBtn.addEventListener(
        "click",
        () => {

            socket.emit(
                "end_call"
            );


            closeCurrentCall();


            isSearching =
                false;


            setStatus(
                "Call ended."
            );

        }
    );


    // ====================================================
    // NEXT
    // ====================================================

    nextBtn.addEventListener(
        "click",
        async () => {

            if (!localStream) {

                const allowed =
                    await requestMedia();


                if (!allowed) {
                    return;
                }

            }


            socket.emit(
                "end_call"
            );


            closeCurrentCall();


            isSearching =
                true;


            setStatus(
                "🔎 Finding another random..."
            );


            socket.emit(
                "find_random"
            );

        }
    );


    // ====================================================
    // PARTNER ENDED
    // ====================================================

    socket.on(
        "partner_ended",
        () => {

            closeCurrentCall();


            isSearching =
                false;


            setStatus(
                "The other person ended the call."
            );

        }
    );


    // ====================================================
    // MICROPHONE
    // ====================================================

    micBtn.addEventListener(
        "click",
        () => {

            if (!localStream) {

                setStatus(
                    "Allow camera & microphone first."
                );

                return;

            }


            const tracks =
                localStream.getAudioTracks();


            if (!tracks.length) {

                setStatus(
                    "No microphone found."
                );

                return;

            }


            const enabled =
                !tracks[0].enabled;


            tracks.forEach(
                track => {

                    track.enabled =
                        enabled;

                }
            );


            micBtn.textContent =
                enabled
                    ? "🎤 Mic On"
                    : "🔇 Mic Off";

        }
    );


    // ====================================================
    // CAMERA
    // ====================================================

    cameraBtn.addEventListener(
        "click",
        () => {

            if (!localStream) {

                setStatus(
                    "Allow camera & microphone first."
                );

                return;

            }


            const tracks =
                localStream.getVideoTracks();


            if (!tracks.length) {

                setStatus(
                    "No camera found."
                );

                return;

            }


            const enabled =
                !tracks[0].enabled;


            tracks.forEach(
                track => {

                    track.enabled =
                        enabled;

                }
            );


            cameraBtn.textContent =
                enabled
                    ? "📹 Camera On"
                    : "📵 Camera Off";

        }
    );


    // ====================================================
    // HEARTBEAT
    // ====================================================

    setInterval(
        () => {

            if (socket.connected) {

                socket.emit(
                    "heartbeat"
                );

            }

        },
        30000
    );


    // ====================================================
    // PAGE CLOSE
    // ====================================================

    window.addEventListener(
        "beforeunload",
        () => {

            try {

                socket.emit(
                    "end_call"
                );

            }

            catch (error) {

                console.error(error);

            }

        }
    );

</script>

</body>

</html>
