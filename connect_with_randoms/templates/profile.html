<!DOCTYPE html>
<html>
<head>
    <title>Connect With Randoms - Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            background: #1f2937;
            border-radius: 20px;
        }

        img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        button {
            margin-top: 25px;
            padding: 15px 35px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .logout {
            display: block;
            margin-top: 20px;
            color: #9ca3af;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    {% if user.picture %}
        <img src="{{ user.picture }}" alt="Profile">
    {% endif %}

    <h1>Welcome, {{ user.name }} 👋</h1>

    <p>{{ user.email }}</p>

    <button onclick="window.location.href='/connect'">
        🎥 Start Connecting
    </button>

    <a class="logout" href="/logout">
        Logout
    </a>

</div>

</body>
</html>
