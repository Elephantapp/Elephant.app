<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Profile - Connect With Randoms</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    background:
        radial-gradient(
            circle at top,
            #202020 0%,
            #0d0d0d 45%,
            #050505 100%
        );

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;
}


/* ==================================================
   HEADER
================================================== */

header {

    background: rgba(15, 15, 15, .95);

    border-bottom:
        1px solid #292929;

    padding: 18px 20px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    position: sticky;

    top: 0;

    z-index: 10;

    backdrop-filter: blur(10px);
}

.logo {

    font-size: 21px;

    font-weight: bold;

}

.logout {

    text-decoration: none;

    color: #fff;

    background: #222;

    border:
        1px solid #3a3a3a;

    padding: 10px 15px;

    border-radius: 10px;

    transition: .2s;

}

.logout:hover {

    background: #333;

}


/* ==================================================
   CONTAINER
================================================== */

.container {

    width: 100%;

    max-width: 650px;

    margin: 0 auto;

    padding:
        35px 20px 50px;

}


/* ==================================================
   PROFILE CARD
================================================== */

.profile-card {

    background:
        linear-gradient(
            145deg,
            #1b1b1b,
            #101010
        );

    border:
        1px solid #2d2d2d;

    border-radius: 24px;

    padding: 35px 25px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);

}


/* ==================================================
   PROFILE PICTURE
================================================== */

.profile-picture {

    width: 120px;

    height: 120px;

    border-radius: 50%;

    object-fit: cover;

    border:
        3px solid #444;

    background: #222;

    box-shadow:
        0 0 0 6px #171717;

}


/* ==================================================
   NAME
================================================== */

.profile-card h1 {

    margin:
        22px 0 8px;

    font-size: 28px;

}

.email {

    color: #999;

    font-size: 15px;

    word-break: break-word;

}


/* ==================================================
   DIVIDER
================================================== */

.divider {

    height: 1px;

    background: #2b2b2b;

    margin:
        28px 0;

}


/* ==================================================
   USER INFO
================================================== */

.info {

    text-align: left;

    display: flex;

    flex-direction: column;

    gap: 12px;

}

.info-row {

    background: #171717;

    border:
        1px solid #252525;

    border-radius: 13px;

    padding: 15px 16px;

}

.info-label {

    color: #777;

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 5px;

}

.info-value {

    color: #eee;

    font-size: 16px;

}


/* ==================================================
   CONNECT BUTTON
================================================== */

.connect-btn {

    display: block;

    width: 100%;

    margin-top: 25px;

    padding: 15px;

    border-radius: 13px;

    background: #fff;

    color: #000;

    text-decoration: none;

    font-size: 17px;

    font-weight: bold;

    transition: .2s;

}

.connect-btn:hover {

    background: #ddd;

    transform: translateY(-1px);

}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 600px) {

    header {

        padding: 15px;

    }

    .logo {

        font-size: 18px;

    }

    .logout {

        padding:
            9px 12px;

        font-size: 14px;

    }

    .container {

        padding:
            25px 15px 40px;

    }

    .profile-card {

        padding:
            30px 18px;

        border-radius: 20px;

    }

    .profile-picture {

        width: 105px;

        height: 105px;

    }

    .profile-card h1 {

        font-size: 24px;

    }

}


/* ==================================================
   SMALL PHONES
================================================== */

@media (max-width: 380px) {

    .profile-card {

        padding:
            25px 15px;

    }

    .profile-picture {

        width: 95px;

        height: 95px;

    }

}

</style>

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header>

    <div class="logo">
        Connect With Randoms
    </div>

    <a
        href="/logout"
        class="logout"
    >
        Logout
    </a>

</header>


<!-- ==================================================
     PROFILE
================================================== -->

<main class="container">

    <div class="profile-card">


        {% if user.picture %}

            <img
                src="{{ user.picture }}"
                alt="Profile Picture"
                class="profile-picture"
            >

        {% else %}

            <div
                class="profile-picture"
                style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:45px;
                "
            >
                👤
            </div>

        {% endif %}


        <h1>
            {{ user.name }}
        </h1>


        <div class="email">
            {{ user.email }}
        </div>


        <div class="divider"></div>


        <div class="info">

            <div class="info-row">

                <div class="info-label">
                    Name
                </div>

                <div class="info-value">
                    {{ user.name }}
                </div>

            </div>


            <div class="info-row">

                <div class="info-label">
                    Email
                </div>

                <div class="info-value">
                    {{ user.email }}
                </div>

            </div>

        </div>


        <a
            href="/connect"
            class="connect-btn"
        >
            🔀 Connect With Randoms
        </a>


    </div>

</main>

<footer class="site-footer">

    <div>
        Made by <strong>Piyush Sharma</strong>
    </div>

    <a
        href="https://www.instagram.com/btwiampiyush._/"
        target="_blank"
        rel="noopener noreferrer"
    >
        Instagram
    </a>

</footer>

</body>
</html>
