<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connect With Randoms</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 18px;
            text-align: center;
            background: #1b1b1b;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        #status {
            text-align: center;
            padding: 15px;
            font-size: 18px;
            color: #ccc;
        }

        .videos {
            display: flex;
            gap: 20px;
            padding: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .video-box {
            position: relative;
            width: min(45%, 600px);
            min-width: 320px;
            aspect-ratio: 16 / 9;
            background: #222;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #333;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .label {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            padding: 7px 12px;
            border-radius: 8px;
            z-index: 2;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 20px;
        }

        button {
            border: none;
            padding: 13px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #micBtn,
        #cameraBtn {
            background: #333;
            color: white;
        }

        #findBtn {
            background: #4caf50;
            color: white;
        }

        #nextBtn {
            background: #2196f3;
            color: white;
        }

        #endBtn {
            background: #e53935;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        @media (max-width: 700px) {

            .video-box {
                width: 95%;
                min-width: 0;
            }

            header h1 {
                font-size: 23px;
            }

            button {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Connect With Randoms</h1>
</header>

<div id="status">
    📷 Starting camera...
</div>

<div class="videos">

    <div class="video-box">

        <div class="label">
            📹 Your Video
        </div>

        <video
            id="localVideo"
            autoplay
            muted
            playsinline>
        </video>

    </div>


    <div class="video-box">

        <div class="label">
            👤 Random Video
        </div>

        <video
            id="remoteVideo"
            autoplay
            playsinline>
        </video>

    </div>

</div>


<div class="controls">

    <button id="micBtn">
        🎤 Mic On
    </button>

    <button id="cameraBtn">
        📹 Camera On
    </button>

    <button id="findBtn">
        🔀 Find Random
    </button>

    <button id="nextBtn">
        ➡️ Next
    </button>

    <button id="endBtn">
        ❌ End
    </button>

</div>


<script>

const socket = io();


/* =========================
   ELEMENTS
========================= */

const localVideo =
    document.getElementById("localVideo");

const remoteVideo =
    document.getElementById("remoteVideo");

const statusText =
    document.getElementById("status");

const micBtn =
    document.getElementById("micBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const findBtn =
    document.getElementById("findBtn");

const nextBtn =
    document.getElementById("nextBtn");

const endBtn =
    document.getElementById("endBtn");


/* =========================
   VARIABLES
========================= */

let localStream = null;

let peerConnection = null;

let partnerSid = null;

let isSearching = false;


/* =========================
   WEBRTC
========================= */

const rtcConfig = {

    iceServers: [

        {
            urls: "stun:stun.l.google.com:19302"
        },

        {
            urls: "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================
   START CAMERA
========================= */

async function startCamera() {

    try {

        statusText.innerText =
            "📷 Camera aur microphone permission maang raha hai...";

        console.log("Starting camera...");

        console.log(
            "Secure context:",
            window.isSecureContext
        );

        console.log(
            "MediaDevices:",
            navigator.mediaDevices
        );


        if (!window.isSecureContext) {

            statusText.innerText =
                "❌ HTTPS required hai.";

            alert(
                "Website HTTPS par open karo."
            );

            return;

        }


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            statusText.innerText =
                "❌ Camera access available nahi hai.";

            return;

        }


        localStream =
            await navigator.mediaDevices.getUserMedia({

                video: true,

                audio: true

            });


        console.log(
            "PERMISSION GRANTED"
        );

        console.log(
            "Tracks:",
            localStream.getTracks()
        );


        localVideo.srcObject =
            localStream;


        localVideo.muted = true;

        localVideo.playsInline = true;


        try {

            await localVideo.play();

        } catch (playError) {

            console.log(
                "Video play error:",
                playError
            );

        }


        statusText.innerText =
            "✅ Permission granted — Camera ready";


        micBtn.innerText =
            "🎤 Mic On";

        cameraBtn.innerText =
            "📹 Camera On";


    } catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );

        console.error(
            "ERROR NAME:",
            error.name
        );

        console.error(
            "ERROR MESSAGE:",
            error.message
        );


        if (
            error.name ===
            "NotAllowedError"
        ) {

            statusText.innerText =
                "❌ Camera/Microphone permission blocked.";

            alert(
                "Camera aur Microphone permission Allow karo."
            );

        }

        else if (
            error.name ===
            "NotFoundError"
        ) {

            statusText.innerText =
                "❌ Camera ya microphone nahi mila.";

        }

        else if (
            error.name ===
            "NotReadableError"
        ) {

            statusText.innerText =
                "❌ Camera kisi aur app mein use ho raha hai.";

        }

        else if (
            error.name ===
            "SecurityError"
        ) {

            statusText.innerText =
                "❌ Browser ne camera access block kiya.";

        }

        else {

            statusText.innerText =
                "❌ Camera error: " +
                error.name;

        }

    }

}


/* =========================
   CREATE PEER
========================= */

function createPeerConnection() {

    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    if (localStream) {

        localStream
            .getTracks()
            .forEach(function(track) {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            });

    }


    peerConnection.ontrack =
        function(event) {

            console.log(
                "REMOTE TRACK RECEIVED"
            );


            if (
                event.streams &&
                event.streams[0]
            ) {

                remoteVideo.srcObject =
                    event.streams[0];

            }

        };


    peerConnection.onicecandidate =
        function(event) {

            if (
                event.candidate &&
                partnerSid
            ) {

                socket.emit(
                    "ice_candidate",
                    {

                        target:
                            partnerSid,

                        candidate:
                            event.candidate

                    }
                );

            }

        };


    peerConnection.onconnectionstatechange =
        function() {

            if (!peerConnection) {
                return;
            }


            console.log(
                "Connection:",
                peerConnection.connectionState
            );


            if (
                peerConnection.connectionState ===
                "connected"
            ) {

                statusText.innerText =
                    "🟢 Connected with a random person";

            }


            if (
                peerConnection.connectionState ===
                "failed"
            ) {

                statusText.innerText =
                    "❌ Connection failed";

            }


            if (
                peerConnection.connectionState ===
                "disconnected"
            ) {

                statusText.innerText =
                    "⚠️ Connection disconnected";

            }

        };


    return peerConnection;

}


/* =========================
   FIND RANDOM
========================= */

findBtn.onclick =
    async function() {


        if (!localStream) {

            await startCamera();

        }


        if (!localStream) {

            return;

        }


        if (isSearching) {

            return;

        }


        isSearching = true;


        statusText.innerText =
            "🔎 Finding a random person...";


        socket.emit(
            "find_random"
        );

    };


/* =========================
   WAITING
========================= */

socket.on(
    "waiting",
    function() {

        isSearching = true;

        statusText.innerText =
            "⏳ Waiting for another person...";

    }
);


/* =========================
   MATCHED
========================= */

socket.on(
    "matched",
    async function(data) {


        isSearching = false;


        partnerSid =
            data.partner_sid;


        statusText.innerText =
            "🎉 Random person found! Connecting...";


        createPeerConnection();


        if (data.initiator) {

            try {

                const offer =
                    await peerConnection.createOffer();


                await peerConnection
                    .setLocalDescription(
                        offer
                    );


                socket.emit(
                    "offer",
                    {

                        target:
                            partnerSid,

                        offer:
                            offer

                    }
                );


            } catch (error) {

                console.error(
                    "Offer error:",
                    error
                );

            }

        }

    }
);


/* =========================
   OFFER
========================= */

socket.on(
    "offer",
    async function(data) {


        partnerSid =
            data.from;


        if (!peerConnection) {

            createPeerConnection();

        }


        try {

            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        data.offer
                    )
                );


            const answer =
                await peerConnection
                    .createAnswer();


            await peerConnection
                .setLocalDescription(
                    answer
                );


            socket.emit(
                "answer",
                {

                    target:
                        partnerSid,

                    answer:
                        answer

                }
            );


        } catch (error) {

            console.error(
                "Offer handling error:",
                error
            );

        }

    }
);


/* =========================
   ANSWER
========================= */

socket.on(
    "answer",
    async function(data) {


        if (!peerConnection) {

            return;

        }


        try {

            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        data.answer
                    )
                );


        } catch (error) {

            console.error(
                "Answer error:",
                error
            );

        }

    }
);


/* =========================
   ICE
========================= */

socket.on(
    "ice_candidate",
    async function(data) {


        if (!peerConnection) {

            return;

        }


        try {

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        data.candidate
                    )
                );


        } catch (error) {

            console.error(
                "ICE error:",
                error
            );

        }

    }
);


/* =========================
   MIC
========================= */

micBtn.onclick =
    function() {


        if (!localStream) {

            return;

        }


        const audioTrack =
            localStream
                .getAudioTracks()[0];


        if (!audioTrack) {

            return;

        }


        audioTrack.enabled =
            !audioTrack.enabled;


        if (audioTrack.enabled) {

            micBtn.innerText =
                "🎤 Mic On";

        } else {

            micBtn.innerText =
                "🔇 Mic Off";

        }

    };


/* =========================
   CAMERA
========================= */

cameraBtn.onclick =
    function() {


        if (!localStream) {

            return;

        }


        const videoTrack =
            localStream
                .getVideoTracks()[0];


        if (!videoTrack) {

            return;

        }


        videoTrack.enabled =
            !videoTrack.enabled;


        if (videoTrack.enabled) {

            cameraBtn.innerText =
                "📹 Camera On";

        } else {

            cameraBtn.innerText =
                "🚫 Camera Off";

        }

    };


/* =========================
   NEXT
========================= */

nextBtn.onclick =
    function() {


        if (partnerSid) {

            socket.emit(
                "end_call",
                {

                    target:
                        partnerSid

                }
            );

        }


        closePeerConnection();


        partnerSid = null;

        isSearching = false;


        statusText.innerText =
            "🔎 Finding another random person...";


        socket.emit(
            "find_random"
        );

    };


/* =========================
   END
========================= */

endBtn.onclick =
    function() {


        if (partnerSid) {

            socket.emit(
                "end_call",
                {

                    target:
                        partnerSid

                }
            );

        }


        closePeerConnection();


        partnerSid = null;

        isSearching = false;


        statusText.innerText =
            "Call ended";

    };


/* =========================
   PARTNER ENDED
========================= */

socket.on(
    "partner_ended",
    function() {


        closePeerConnection();


        partnerSid = null;

        isSearching = false;


        statusText.innerText =
            "👋 The other person ended the call.";

    }
);


/* =========================
   CLOSE PEER
========================= */

function closePeerConnection() {


    if (peerConnection) {

        peerConnection.close();

        peerConnection = null;

    }


    remoteVideo.srcObject =
        null;

}


/* =========================
   SOCKET CONNECTED
========================= */

socket.on(
    "connect",
    function() {

        console.log(
            "Socket connected:",
            socket.id
        );

    }
);


/* =========================
   PAGE LOAD
========================= */

window.addEventListener(
    "load",
    async function() {

        await startCamera();

    }
);

</script>

</body>
</html>
