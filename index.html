<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connect With Randoms</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 45px 25px;
            background: #1f2937;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            color: #d1d5db;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .login-btn {
            display: inline-block;
            padding: 15px 28px;
            background: white;
            color: #111827;
            text-decoration: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .features {
            margin-top: 35px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .feature {
            padding: 15px;
            background: #374151;
            border-radius: 10px;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 32px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Connect With Randoms</h1>

    <p>
        Meet new people. Chat. Talk. Connect.
    </p>

    <a class="login-btn" href="/login/google">
        Continue with Google
    </a>

    <div class="features">

        <div class="feature">
            📹 Random Video Chat
        </div>

        <div class="feature">
            💬 Chat
        </div>

        <div class="feature">
            🎤 Voice & Mic
        </div>

        <div class="feature">
            🌎 Meet People
        </div>

    </div>

</div>

</body>
</html>
